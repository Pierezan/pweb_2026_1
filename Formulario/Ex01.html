<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="../Formulario/Ex01.html">
        <fieldset>
            <legend>
                <h2><strong>Formulário Matricula de Curso</strong></h2>
            </legend>
            <p>Primeiro nome</p>
            <input type="text">
            <p>Sobrenome</p>
            <input type="text">
            <br>
            <p><strong>Curso</strong></p>
            <form action=""></form>
            <label for="op1">
            <input type="radio">
            Tecnico em Informática
            </label>
            <br>
            <label for="op2">
            <input type="radio">
            Graduação - Análise e Desenvolvimento de Sistemas

            </label>
            <br>
            <label for="op3">
            <input type="radio">
            Profissionalização - Programação Web
            
            </label>
            </form>

            <p><strong>Linguagens de programação de sua preferencia</strong></p>
            <label for="">
            <input type="checkbox" name="php" id="a" >
            PHP
            </label>
            <br>
            <label for="">
            <input type="checkbox" name="java" id="a" >
            Java
            </label>
            <br>
            <label for="">
            <input type="checkbox" name="Python" id="a" >
            Python
            </label>

            <p><strong>Escolha um turno:</strong></p>
            <select name="a" id="">
                <option value="a">Manhã</option>
                <option value="a">Tarde</option>
                <option value="a">Noite</option>

            </select>
            <br><br>
            


            <label for="browser-choice">Escolha uma unidade mais próxima de você:</label>
            <br>

            <input list="browsers" id="browser-choice" name="browser-choice" />
           

            <datalist id="browsers">
            <option value="Chapecó"></option>
            <option value="Pinhalzinho"></option>
            <option value="Nova Erechim"></option>
            <option value="Nova Itaberaba"></option>
            </datalist>




        </fieldset>






    </form>
